[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binix"
version = "0.1.0"
description = "Small command-line toolkit for inspecting binary files."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"

[project.scripts]
binix = "binix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
