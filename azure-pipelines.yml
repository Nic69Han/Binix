# Azure Pipelines CI for Binix.
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      test -f LICENSE
      test -f README.md
      echo "Repository sanity checks passed."
    displayName: 'Repository sanity checks'

  # Add build and test steps here once the project language is chosen.
