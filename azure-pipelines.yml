# Azure Pipelines CI for Binix.
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    py39:
      python.version: '3.9'
    py312:
      python.version: '3.12'

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'
    displayName: 'Use Python $(python.version)'

  - script: |
      python -m pip install --upgrade pip
      pip install . pytest
    displayName: 'Install'

  - script: python -m pytest -v
    displayName: 'Run tests'

  - script: binix info LICENSE
    displayName: 'Smoke test CLI'

  - script: |
      pip install build twine
      python -m build
      twine check dist/*
    displayName: 'Build and check distribution'
